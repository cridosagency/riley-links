<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>riley ;p</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 414px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* TOP CARD WITH FADE */
        .profile-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 25px;
        }

        h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .handle { color: #ccc; font-size: 13px; margin-bottom: 15px; }

        .icons {
            display: flex;
            justify-content: center;
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            background: #3b82f6;
            border: 1.5px solid rgba(255,255,255,0.2);
        }

        .cta-text { 
            text-align: center;
            font-size: 14px; 
            color: #fff; 
            margin: 30px 0; 
        }

        /* POOL CARD RECTANGLE */
        .exclusive-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 25px;
            overflow: hidden;
            display: block;
            text-decoration: none;
            
            /* ---> NEW CODE BEGINS <--- */
            /* This applies the 'buzz' animation every 2 seconds */
            animation: buzz 2s linear infinite;
            /* ---> NEW CODE ENDS <--- */
        }

        .exclusive-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exclusive-label {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* ---> NEW CODE BEGINS <--- */
        /* THE BUZZ ANIMATION DEFINITION */
        /* We make the buzz itself very rapid (first 10% of the 2s cycle), and then it sits still. */
        @keyframes buzz {
            0% { transform: translate(0, 0) rotate(0deg); }
            1% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            2% { transform: translate(1px, -1px) rotate(0.5deg); }
            3% { transform: translate(-1px, -1px) rotate(-0.5deg); }
            4% { transform: translate(1px, 1px) rotate(0.5deg); }
            5% { transform: translate(-1px, -1px) rotate(-0.5deg); }
            6% { transform: translate(1px, 1px) rotate(0.5deg); }
            7% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            8% { transform: translate(1px, -1px) rotate(0.5deg); }
            9% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(0, 0) rotate(0deg); } /* Sit still for the rest of the cycle */
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        /* ---> NEW CODE ENDS <--- */

    </style>
</head>
<body>

    <div class="container">
        
        <div class="profile-box">
            <img src="top.jpg" alt="Riley">
            <div class="gradient-overlay">
                <h1>Riley ❤️</h1>
                <div class="handle">@justrileyxo</div>
                <div class="icons">
                    <a href="https://onlyfans.com/justrileyxo/c12" class="icon-circle">🔒</a>
                </div>
            </div>
        </div>

        <p class="cta-text">Below is what you're looking for ;)</p>

        <a href="https://onlyfans.com/justrileyxo/c12" class="exclusive-card" id="vip-link">
            <img src="pool.jpg" alt="Exclusive">
            <div class="exclusive-label">Exclusive things ;)</div>
        </a>

    </div>

    <script>
        document.getElementById('vip-link').addEventListener('click', function(e) {
            const ofLink = "https://onlyfans.com/justrileyxo/c12";
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/Android/i.test(ua)) {
                e.preventDefault();
                window.location.href = "intent://" + ofLink.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
            }
        });
    </script>

</body>
</html>
