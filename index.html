<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>riley ;p</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px; /* Slimmer container looks more professional */
            padding: 20px;
            text-align: center;
        }

        /* Top Profile Pic */
        .profile-img {
            width: 100%;
            aspect-ratio: 4/5;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        h1 { margin: 10px 0 0; font-size: 26px; font-weight: 700; }
        .handle { color: #888; font-size: 13px; margin-bottom: 15px; }

        /* Small Circle Icons */
        .icons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .icon-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            text-decoration: none;
        }

        .cta-text { font-size: 14px; color: #ccc; margin-bottom: 15px; }

        /* THE "NORMAL RECTANGLE" CARD */
        .exclusive-card {
            width: 100%;
            aspect-ratio: 16 / 9; /* This creates the "Normal Rectangle" shape */
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            display: block;
            text-decoration: none;
            border: 1px solid #333; /* Adds a subtle outline */
        }

        .exclusive-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Crops the photo perfectly to fit the rectangle */
            display: block;
        }

        .exclusive-label {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        .footer-nav {
            margin-top: 25px;
            color: #444;
            font-size: 12px;
            display: flex;
            justify-content: center;
            gap: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="top.jpg" class="profile-img" alt="Riley">
        
        <h1>Riley ❤️</h1>
        <div class="handle">@justriley</div>

        <div class="icons">
            <a href="https://onlyfans.com/YOUR_FREE_PAGE" class="icon-circle">🔒</a>
            <a href="https://twitter.com/YOUR_HANDLE" class="icon-circle">📸</a>
        </div>

        <p class="cta-text">Below is what you're looking for ;)</p>

        <a href="https://onlyfans.com/YOUR_PAID_PAGE" class="exclusive-card" id="vip-link">
            <img src="pool.jpg" alt="Exclusive">
            <div class="exclusive-label">Exclusive things ;)</div>
        </a>

        <div class="footer-nav">
            <span>Shouts</span>
            <span>Media</span>
        </div>
    </div>

    <script>
        document.getElementById('vip-link').addEventListener('click', function(e) {
            const ofLink = "https://onlyfans.com/YOUR_PAID_PAGE";
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/Android/i.test(ua)) {
                e.preventDefault();
                window.location.href = "intent://" + ofLink.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
            }
        });
    </script>
</body>
</html>
