<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>riley ;p</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HIGH-VISIBILITY HINT BAR */
        #app-hint {
            display: none;
            width: 100%;
            background: #3b82f6;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        .container {
            width: 100%;
            max-width: 414px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* TOP CARD WITH OVERLAY */
        .profile-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile-box img { width: 100%; height: 100%; object-fit: cover; }

        .gradient-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 55%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 25px;
        }

        h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .handle { color: #ccc; font-size: 13px; margin-bottom: 15px; }

        .icon-circle {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 20px;
            background: #3b82f6; border: 1.5px solid rgba(255,255,255,0.2);
        }

        .cta-text { text-align: center; font-size: 14px; margin: 30px 0; font-weight: 500; }

        /* POOL CARD WITH BUZZ */
        .exclusive-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 25px;
            overflow: hidden;
            display: block;
            text-decoration: none;
            animation: buzz 2.5s linear infinite;
        }

        .exclusive-card img { width: 100%; height: 100%; object-fit: cover; }

        .exclusive-label {
            position: absolute;
            bottom: 15px; left: 0; right: 0;
            text-align: center; font-weight: 600; font-size: 18px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* BUZZ EFFECT */
        @keyframes buzz {
            0%, 90%, 100% { transform: translate(0, 0) rotate(0deg); }
            91% { transform: translate(-1.5px, 1.5px) rotate(-1deg); }
            92% { transform: translate(1.5px, -1.5px) rotate(1deg); }
            93% { transform: translate(-1.5px, -1.5px) rotate(-1deg); }
            94% { transform: translate(1.5px, 1.5px) rotate(1deg); }
            95% { transform: translate(-1.5px, 1.5px) rotate(-1deg); }
            96% { transform: translate(1.5px, -1.5px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <div id="app-hint">⚠️ Tap ( ⋮ ) then "Open in Safari" for full content 🔓</div>

    <div class="container">
        
        <div class="profile-box">
            <img src="top.jpg" alt="Riley">
            <div class="gradient-overlay">
                <h1>Riley ❤️</h1>
                <div class="handle">@justrileyxo</div>
                <div class="icons">
                    <a href="https://onlyfans.com/justrileyxo/c12" class="icon-circle">🔒</a>
                </div>
            </div>
        </div>

        <p class="cta-text">Below is what you're looking for ;)</p>

        <a href="https://onlyfans.com/justrileyxo/c12" class="exclusive-card" id="vip-link">
            <img src="pool.jpg" alt="Exclusive">
            <div class="exclusive-label">Exclusive things ;)</div>
        </a>

    </div>

    <script>
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isApp = /Instagram|FBAN|FBAV|TikTok|Telegram/i.test(ua);
        const targetUrl = "https://onlyfans.com/justrileyxo/c12";

        if (isApp) {
            document.getElementById('app-hint').style.display = 'block';
        }

        document.getElementById('vip-link').addEventListener('click', function(e) {
            // ANDROID GLITCH
            if (/Android/i.test(ua)) {
                e.preventDefault();
                window.location.href = "intent://" + targetUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
            } 
            // IOS GLITCH
            else if (/iPhone|iPad|iPod/i.test(ua) && isApp) {
                // This 'glitch' tries to trigger the system browser handler 
                // by opening a blank tab and then redirecting the primary one.
                window.open(targetUrl, '_blank');
                
                // Fallback alert for stubborn versions of IG
                setTimeout(() => {
                    alert("Almost there! 🍒 Tap the ( ⋮ ) at the top right and select 'Open in Safari' to see the video.");
                }, 800);
            }
        });
    </script>

</body>
</html>
