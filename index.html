<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>riley ;p</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 414px; /* Typical iPhone width */
            padding: 20px;
            box-sizing: border-box;
        }

        /* TOP SECTION WITH OVERLAY */
        .profile-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The Fade to Black Effect */
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .handle { color: #ccc; font-size: 13px; margin-bottom: 15px; }

        .icons {
            display: flex;
            gap: 10px;
        }

        .icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            border: 1.5px solid rgba(255,255,255,0.3);
        }

        /* Specific colors from your pic */
        .bg-blue { background: #3b82f6; }
        .bg-pink { background: #f472b6; }

        .cta-text { 
            text-align: center;
            font-size: 14px; 
            color: #fff; 
            margin: 25px 0; 
        }

        /* POOL RECTANGLE WITH OVERLAY */
        .exclusive-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 25px;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }

        .exclusive-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exclusive-label {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="profile-box">
            <img src="top.jpg" alt="Riley">
            <div class="gradient-overlay">
                <h1>Riley ❤️</h1>
                <div class="handle">@justriley</div>
                <div class="icons">
                    <a href="https://onlyfans.com/YOUR_FREE_LINK" class="icon-circle bg-blue">🔒</a>
                    <a href="https://onlyfans.com/YOUR_PAID_LINK" class="icon-circle bg-pink">me</a>
                </div>
            </div>
        </div>

        <p class="cta-text">Below is what you're looking for ;)</p>

        <a href="https://onlyfans.com/YOUR_PAID_LINK" class="exclusive-card" id="vip-link">
            <img src="pool.jpg" alt="Exclusive">
            <div class="exclusive-label">Exclusive things ;)</div>
        </a>

    </div>

    <script>
        document.getElementById('vip-link').addEventListener('click', function(e) {
            const ofLink = "https://onlyfans.com/YOUR_PAID_LINK";
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/Android/i.test(ua)) {
                e.preventDefault();
                window.location.href = "intent://" + ofLink.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
            }
        });
    </script>

</body>
</html>
